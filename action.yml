name: "AI Code Reviewer"
description: >-
  Rule-based security review of pull requests (no LLM, no paid AI).
  Scans changed code for hardcoded secrets, SQL injection, unsafe
  deserialization, weak crypto, path traversal, SSRF-prone URLs, and
  debug flags, then posts a Markdown summary as a PR comment.
author: "Tahir Younas"

inputs:
  path:
    description: "File or directory to scan (ignored when diff is set)"
    required: false
    default: "."
  fail-on:
    description: "Fail the check if a finding is at or above this severity"
    required: false
    default: "high"
  min-severity:
    description: "Ignore findings below this severity"
    required: false
    default: "low"
  post-comment:
    description: "Post the Markdown report as a PR comment (pull_request only)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run ai-code-reviewer
      shell: bash
      run: |
        PYTHONPATH="${{ github.action_path }}${PYTHONPATH:+:$PYTHONPATH}" \
        python3 -m ai_code_reviewer "${{ inputs.path }}" \
          --format all \
          --output-dir reviewer-report \
          --fail-on "${{ inputs.fail-on }}" \
          --min-severity "${{ inputs.min-severity }}" \
          || echo "REVIEWER_EXIT=$?" >> "$GITHUB_ENV"

    - name: Post PR comment
      if: ${{ github.event_name == 'pull_request' && inputs.post-comment == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file reviewer-report/report.md

    - name: Enforce fail-on threshold
      shell: bash
      run: |
        if [ "${REVIEWER_EXIT:-0}" != "0" ]; then
          echo "ai-code-reviewer found findings at or above the fail-on threshold."
          exit 1
        fi
